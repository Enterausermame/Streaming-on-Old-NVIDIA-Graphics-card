# Sunshine 虚拟鼠标设备的 libinput 配置
# 安装到 /etc/X11/xorg.conf.d/30-virtualhid-input.conf
# 修复: "Step value 0" 导致 libinput 回退加速 + KDE 无法识别后端

Section "InputClass"
    Identifier      "virtualhid mouse fix"
    MatchProduct    "libvirtualhid Mouse"
    MatchDevicePath "/dev/input/event*"
    Driver          "libinput"
    Option          "ScrollMethod" "none"
    Option          "AccelProfile" "flat"
    Option          "AccelSpeed" "0"
    Option          "ScrollPixelDistance" "15"
EndSection

Section "InputClass"
    Identifier      "virtualhid mouse abs fix"
    MatchProduct    "libvirtualhid Mouse (Absolute)"
    MatchDevicePath "/dev/input/event*"
    Driver          "libinput"
    Option          "AccelProfile" "flat"
    Option          "AccelSpeed" "0"
    Option          "ScrollPixelDistance" "15"
EndSection
